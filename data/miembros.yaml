# Bios are Markdown. Photos live in assets/images/miembros/. `founder` labels and pins the founder first.
- name: Gabriel J. Pérez Irizarry
  photo: gabriel.jpg
  founder: Fundador y organizador
  bio: Fundé Indie Hackers Puerto Rico y la sigo corriendo. En [Gabezen](https://gabezen.com) configuro Claude para firmas que le facturan a clientes, empezando con [uno de sus trabajos](https://gabezen.com/hand-off-one-job/), gratis y sin reunión. Llevo 15 años escribiendo código y más de 50 apps en producción. Lideré la tecnología de CITYROW hasta su adquisición por WaterRower, y creé y vendí [Peer Feedback](https://www.peerfeedback.io/), que evaluó 323,000 revisiones entre pares de 11,000 estudiantes de Georgia Tech. Co-fundador y CTO de [Nexrizen](https://www.nexrizen.com), que corre en Claude desde enero de 2026. Inventor en dos patentes de IBM. Ex-alumno del Colegio y Georgia Tech. Conecta conmigo en [LinkedIn](https://www.linkedin.com/in/gabrieljperezirizarry/).

- name: Javier Rosario
  photo: javier.jpg
  bio: Ingeniero multifacetico especializado en el area de DevOps y dinamica de equipos. Puedes ver mis trabajos de Maker en [MightyJRMods](https://www.mightyjrmods.com) y en [LinkedIn](https://www.linkedin.com/in/javierorosario/).

- name: Gabriel Soto
  photo: gabriel-soto.jpg
  bio: Experto en mercadeo digital y fundador de [Linked Innovation](https://clientesdecalidad.digital/evaluacion). Me especializó en conseguir leads para negocios locales y para la industria de bienes raíces. [Buscame en LinkedIn](https://www.linkedin.com/in/angel-gabriel-medina-a4767b185).

- name: Xiomara Figueroa
  photo: xiomara.jpg
  bio: Científica de cómputos, actualmente co-fundadora y CTO de [BookSloth](https://www.booksloth.com/). Además de codear, me gusta boxear y escuchar podcasts. Algunos de mis favoritos son Snacks Daily, A16Z y Mentores en Linea. Algunos temas que me gusta escuchar / leer / consumir, además de temas de empresarismo y tecnología, son biografías, ciencia ficción, y ficción histórica. A veces escribo en Medium, aunque me gustaría escribir más. Sigueme en [Twitter](https://twitter.com/_xiomara7), [Medium](https://medium.com/@figueroa_xio), [LinkedIn](https://pr.linkedin.com/in/xiomarafigueroa) y [mi pagina personal](https://xiomara7.github.io).

- name: David Soto
  photo: david.jpg
  bio: Experto en manejo de datos en todas las plataformas con enfoque en tecnologias cloud. Le apasiona expandir aplicaciones existentes con soluciones modernas y la eficiencia en optimización de procesos. [Página de productos y servicios](https://customcomstudio.com).

- name: Leira C. Sánchez Quiñones
  photo: leira.jpg
  bio: Ingeniero mecánico turned ingeniero de software. Founding Software Engineer en [jam.ai](https://join.jam.ai/). Fundadora de [mofongojobs.com](https://mofongojobs.com/), una plataforma que conecta al talento de Puerto Rico con oportunidades profesionales locales y remotas.

- name: Hector Ayala
  photo: hector.jpg
  bio: Cofundador de [Hecdemi](https://www.hecdemi.com/) actualmente creando [Hyperion](https://www.hyperion.finance/). Soy ingeniero de computadoras con experiencia diseñando y desarrollando software para maquinas automatizadas de manufactura (PLCs + HMIs), programas web, videos de promoción y efectos especiales, branding de productos, aplicaciones en la nube (AWS), y API software. Puedes ver alguno de mis inventos y proyectos en mi [pagina personal](https://www.bombillazo.com/). Sígueme en [Twitter](https://twitter.com/bombillazo), [Github](https://github.com/bombillazo) y conecta por [LinkedIn](https://www.linkedin.com/in/bombillazo/).

- name: José Francisco Rodríguez Zayas
  photo: chisko.jpg
  bio: Tiene más de tres años de experiencia trabajando principalmente como web developer. Analista en programación con vasta experiencia en el desarrollo en diferentes entornos técnicos. [Pagina personal](https://www.chisko.dev/) y [LinkedIn](https://www.linkedin.com/in/jrodriguez-zayas/).

- name: Juan G. De Jesús Torres
  photo: juan.png
  bio: Desarrolla software en [Qinetix](https://www.linkedin.com/company/qinetix-group-llc/). Adicto a los JRPGs y todo lo que tenga que ver con Role Playing Games. Desarrolla herramientas de software en su tiempo libre. Visita su [GitHub](https://github.com/juan1003) y [síguele en Twitter](https://twitter.com/jdejesus93). Para contratarlo puedes [escribirle](mailto:jdejesus93@gmail.com).

- name: Emanuel Rolon
  photo: emanuel.jpg
  bio: Fundador de [Lumigraph Press](https://lumigraphpress.com), una editorial en Houston, Texas, que produce libros de no ficción para Hispanic knowledge experts y construye a su alrededor el sistema de autoridad (web, materiales y lead magnets). También creó [Valado](https://valado.co), un directorio de expertos avalados que atienden en español. Encuéntralo en [LinkedIn](https://www.linkedin.com/in/emanuelrolon/) e [Instagram](https://instagram.com/by_rolon).

- name: Nathalia N. Cruz Ortiz
  photo: nathalia.jpg
  bio: A passionate Public Relations Specialist with over a decade of successful experience in marketing and sales. She is a passionate communicator, a published columnist, radio and event host. She also coaches small business owners to create marketing campaigns, processes and systems in order to maximize their time and increase profitability. Follow her on [Twitter](https://twitter.com/pink_pulpo) and [LinkedIn](https://www.linkedin.com/in/nathaliacruzortiz/).

- name: Onix Ortiz
  photo: onix.jpg
  bio: Administrador de Proyectos y Consultor en Tecnología con más de 15 años de experiencia en el manejo de Tecnología Aplicada. Cuenta con experiencia en los mercados de Puerto Rico, EEUU y Panamá. Inventor por pasión. Fundador de [Dsinergia](https://www.dsinergia.com/) y [OnixOrtiz.com](https://onixortiz.com/).

- name: Camille Padilla Dalmau
  photo: camille.jpg
  bio: Periodista, educadora y fundadora de [9 Millones](https://9millones.com/), una plataforma que conecta a los nueve millones de boricuas alrededor del mundo a través del storytelling. Antes de emprender, Camille trabajó en NowThis creciendo su audiencia latinoamericana. Ha sido reportera en medios de la Ciudad de Nueva York, San Juan, Filadelfia y Buenos Aires. Sus temas de interés son el ambientalismo, la justicia social y la governanza.

- name: Mikel Martinez
  photo: mikel.jpg
  bio: Ha sido productor de programa radial, gerente de proyectos y community manager. Fundador de [Mikel Media](https://mikel.media/). Produce sus podcasts [Rock 'n' Block](https://anchor.fm/rocknblock) y Emprendedor Singular. Su mayor pasión es poder ayudar a otros a lograr su máximo potencial.
